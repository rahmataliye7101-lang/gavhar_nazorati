<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gavhar nazorat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/static/chart.umd.min.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#f1f2f6);--card:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#14171f);
  --mut:var(--tg-theme-hint-color,#8a8f99);--acc:var(--tg-theme-button-color,#2f80ed);--acc-tx:var(--tg-theme-button-text-color,#fff);
  --line:rgba(127,127,127,.18);--red:#e5484d;--red-bg:rgba(229,72,77,.11);--grn:#30a46c;--grn-bg:rgba(48,164,108,.12);
  --amb:#d97706;--amb-bg:rgba(217,119,6,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 8px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.sec{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 8px}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:2px 0}
.mut{color:var(--mut);font-size:13px}.sm{font-size:13px}
.rw{display:flex;align-items:center;justify-content:space-between;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .card{margin:0}
.lb{font-size:12px;color:var(--mut)}.v{font-size:18px;font-weight:700;margin-top:2px}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0 6px}.bar i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bd{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
.bd.r{background:var(--red-bg);color:var(--red)}.bd.g{background:var(--grn-bg);color:var(--grn)}.bd.a{background:var(--amb-bg);color:var(--amb)}.bd.n{background:var(--line);color:var(--mut)}
.red{color:var(--red)}.grn{color:var(--grn)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600;background:var(--acc);color:var(--acc-tx);cursor:pointer}
.btn:disabled{opacity:.5}
.btn2{white-space:nowrap;border:0;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;background:var(--line);color:var(--tx);cursor:pointer}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:3px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;min-width:max-content;border:0;background:none;color:var(--mut);font-size:13px;font-weight:600;padding:8px 10px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acc-tx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}.chip{border:0;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--card);color:var(--tx);white-space:nowrap;cursor:pointer}
.chip.on{background:var(--acc);color:var(--acc-tx)}
.fbar{background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:10px}.fbar .chips{padding:0 0 8px}.fbar .chip{background:var(--bg)}.fbar .chip.on{background:var(--acc);color:var(--acc-tx)}
.fbar select{padding:8px 10px;font-size:14px}
.davr{border:1.5px solid var(--acc)}
select,input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:10px;font-size:15px}
label.f{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
.alert{border:1.5px solid var(--red);background:var(--red-bg)}
.inv{cursor:pointer}.inv .amt{font-size:17px;font-weight:600}
.det{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.err{border-left:3px solid var(--red);border-radius:0 16px 16px 0}.err.cheap{border-left-color:var(--amb)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:7px 3px;border-bottom:1px solid var(--line);text-align:right}td:first-child,th:first-child{text-align:left}th{font-size:12px;color:var(--mut);font-weight:600}
tr:last-child td{border-bottom:0}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tab{flex:1;border:0;background:none;color:var(--mut);font-size:11px;font-weight:600;padding:5px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab{position:relative}.tab svg{width:22px;height:22px}.tab.on{color:var(--acc)}
.backbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:4px;color:var(--acc);font-weight:600;font-size:15px;
  padding:8px 4px 10px;margin:-4px 0 4px;background:var(--bg);cursor:pointer}
.pg{display:none}.pg.on{display:block}
.note{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}.note:last-child{border:0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}
.toast.on{opacity:.95}
.prices{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13.5px;margin-top:8px}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.skel{height:96px;border-radius:16px;background:var(--card);opacity:.6;margin-bottom:10px}
.filt{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:13px}
  .trl{margin-top:6px;font-size:12px;color:var(--mut)}
  .vq{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg2,rgba(52,199,89,.08))}
  .upres{white-space:pre-wrap;font-size:12.5px;margin-top:10px;padding:10px;border-radius:10px;background:var(--bg2,rgba(0,0,0,.04));max-height:420px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <div id="backbar" class="backbar" style="display:none" onclick="back()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span id="backlbl">Orqaga</span></div>
  <section class="pg on" id="p-holat"><div class="skel"></div><div class="skel"></div><div class="skel"></div></section>
  <section class="pg" id="p-faktura"></section>
  <section class="pg" id="p-xato"></section>
  <section class="pg" id="p-transh"></section>
  <section class="pg" id="p-admin"></section>
</div>

<nav class="tabs">
  <button class="tab on" data-p="holat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Holat</button>
  <button class="tab" data-p="faktura"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>Faktura</button>
  <button class="tab" data-p="xato"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 18h.01"/></svg>Xatoliklar</button>
  <button class="tab" data-p="transh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Transhlar</button>
  <button class="tab" data-p="admin" id="tab-admin" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M17 8v6M14 11h6"/></svg>Admin<span id="adm-badge" style="display:none;position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:10px;font-size:10px;line-height:16px;padding:0 5px"></span></button>
</nav>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram ? Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {} }
const $ = s => document.querySelector(s);

/* Kirill → lotin (serverdan keladigan matnlar uchun) */
const CY = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'j','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'x','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':"'",'ы':'i','ь':'','э':'e','ю':'yu','я':'ya','ў':"o'",'қ':'q','ғ':"g'",'ҳ':'h'};
function L(s) {
  if (s == null) return '';
  return String(s).replace(/[А-Яа-яЁёЎўҚқҒғҲҳ]/g, (ch, i, str) => {
    const lo = ch.toLowerCase(), up = ch !== lo;
    let r = CY[lo] ?? ch;
    if (lo === 'е' && (i === 0 || !/[А-Яа-яЁёЎўҚқҒғҲҳ]/.test(str[i - 1]))) r = 'ye';
    if (!up) return r;
    const nextUp = str[i + 1] && str[i + 1] !== str[i + 1].toLowerCase();
    return nextUp ? r.toUpperCase() : r.charAt(0).toUpperCase() + r.slice(1);
  });
}
const fmt = (x, d = 0) => x == null ? '—' : Number(x).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const usd = (x, d = 0) => x == null ? '—' : (x < 0 ? '−' : '') + fmt(Math.abs(x), d) + ' $';
const sgn = (x, d = 2) => x == null ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '') + fmt(Math.abs(x), d);
const dmy = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(0, 4) : '—';
const dm = s => s ? s.slice(8, 10) + '.' + s.slice(5, 7) : '—';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const E = s => esc(L(s));
const TYPES = ['Бриллиант', 'Вакс', 'Дорика', 'Фианит', 'Браслет', 'Детский', 'Ван Клиф'];
const isClosed = h => String(h || '').startsWith('Ёпилган');
const holatL = h => isClosed(h) ? 'Yopilgan' : ({'Фаол': 'Faol', 'Тугаган': 'Tugagan', 'Ишлатилмаган': 'Ishlatilmagan'}[h] || L(h));
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2400); }
function haptic(k) { try { tg && tg.HapticFeedback.notificationOccurred(k); } catch (e) {} }
function farqBadge(f, bad) {
  if (!bad) return '<span class="bd g">✓ to\'g\'ri</span>';
  return f > 0 ? `<span class="bd r">⚠ ${sgn(f)} $</span>` : `<span class="bd a">⚠ ${sgn(f)} $</span>`;
}

async function api(path, body) {
  const r = await fetch(path, {method: body ? 'POST' : 'GET', headers: {'Content-Type': 'application/json', 'X-Init-Data': tg ? tg.initData : ''}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(L((j.errors && j.errors.join('; ')) || j.error || ('Xato ' + r.status)));
  return j;
}
function fail(el, e) { el.innerHTML = `<div class="card empty">⚠️ ${esc(e.message)}</div>`; }

/* ---------- TABLAR ---------- */
const loaded = {};
let F = {tr: [], oy: ''}, FO = null, CUR = 'holat';
const qs = () => `?tr=${F.tr.join(',')}&oy=${F.oy}`;
async function ensureFO() { if (!FO) FO = await api('/api/filtr'); }
function filterBar(withTr = true) {
  if (!FO) return '';
  const trChips = withTr ? `<div class="chips">
      <button class="chip ${F.tr.length ? '' : 'on'}" data-ftr="all">Barcha transhlar</button>
      ${FO.transhlar.map(t => `<button class="chip ${F.tr.includes(t.no) ? 'on' : ''}" data-ftr="${t.no}">№${t.no} · ${dm(t.sana)} · ${fmt(t.summa / 1000)}k $</button>`).join('')}
    </div>` : '';
  return `<div class="fbar">${trChips}
    <select data-foy><option value="">Barcha oylar</option>${FO.oylar.map(m => `<option value="${m.oy}" ${F.oy === m.oy ? 'selected' : ''}>${m.nomi}</option>`).join('')}</select>
  </div>`;
}
function bindFilter(el) {
  el.querySelectorAll('[data-ftr]').forEach(b => b.onclick = () => {
    const v = b.dataset.ftr;
    if (v === 'all') F.tr = [];
    else { const n = +v; F.tr = F.tr.includes(n) ? F.tr.filter(x => x !== n) : [...F.tr, n].sort(); }
    invalidate(); show(CUR, true);
  });
  const s = el.querySelector('[data-foy]'); if (s) s.onchange = () => { F.oy = s.value; invalidate(); show(CUR, true); };
}
/* ---------- ORQAGA (back) navigatsiyasi ----------
   NAV — qadamlar steki: {t:'tab', p, onBack} — boshqa bo'limdan o'tilgan bo'lsa; {t:'sub', tag, undo, lbl} — ochilgan ichki oyna.
   Pastdagi tablar bosilsa — stek tozalanadi (yuqori daraja). Telegram'ning o'z «Orqaga» tugmasi ham shu stek bilan ishlaydi. */
let NAV = [];
const TAB_L = {holat: 'Holat', faktura: 'Faktura', xato: 'Xatoliklar', transh: 'Transhlar', admin: 'Admin'};
function navTo(p, force, onBack) { if (p !== CUR) NAV.push({t: 'tab', p: CUR, onBack}); show(p, force); updBack(); }
function pushSub(tag, undo, lbl) { NAV = NAV.filter(x => x.tag !== tag); NAV.push({t: 'sub', tag, undo, lbl}); updBack(); }
function dropSub(tag) { NAV = NAV.filter(x => x.tag !== tag); updBack(); }
function back() {
  const x = NAV.pop();
  if (!x) return updBack();
  if (x.t === 'sub') x.undo();
  else { if (x.onBack) x.onBack(); show(x.p); }
  updBack();
}
function updBack() {
  const x = NAV[NAV.length - 1];
  const bb = $('#backbar');
  if (x) { bb.style.display = 'flex'; $('#backlbl').textContent = x.t === 'tab' ? TAB_L[x.p] || 'Orqaga' : (x.lbl || 'Orqaga'); }
  else bb.style.display = 'none';
  try { if (tg && tg.BackButton) { x ? tg.BackButton.show() : tg.BackButton.hide(); } } catch (e) {}
}
try { if (tg && tg.BackButton) tg.BackButton.onClick(back); } catch (e) {}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { NAV = []; show(b.dataset.p); updBack(); });
function show(p, force) {
  CUR = p;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.p === p));
  document.querySelectorAll('.pg').forEach(x => x.classList.toggle('on', x.id === 'p-' + p));
  window.scrollTo(0, 0);
  if (!loaded[p] || force) { loaded[p] = true; ({holat: loadHolat, faktura: loadFaktura, xato: loadXato, transh: loadTransh, admin: loadAdmin})[p](); }
}
function invalidate() { loaded.holat = loaded.faktura = loaded.xato = false; FO = null; }

/* ---------- HOLAT ---------- */
let chart;
async function loadHolat() {
  const el = $('#p-holat');
  try {
    await ensureFO();
    const d = await api('/api/holat' + qs());
    const a = d.active, o = d.oxirgi, dv = d.davr;
    const open = d.transhlar.filter(t => !isClosed(t.holat));
    el.innerHTML = filterBar() + (dv ? `
    <div class="card davr">
      <div class="mut">Tanlangan davr: ${dv.oy_nomi || 'barcha oylar'} · ${dv.tr.length ? 'transh ' + dv.tr.map(n => '№' + n).join(', ') : 'barcha transhlar'}</div>
      <div class="g2" style="margin-top:10px">
        <div><div class="lb">Fakturalar</div><div class="v">${fmt(dv.faktura_soni)}</div><div class="mut">${fmt(dv.n)} pozitsiya · ${fmt(dv.gramm, 2)} gr</div></div>
        <div><div class="lb">Faktura qiymati</div><div class="v">${usd(dv.fakt, 2)}</div><div class="mut">hisob bo'yicha ${usd(dv.hisob, 2)}</div></div>
        <div><div class="lb">Farq (ortiqcha)</div><div class="v ${dv.farq > 0.5 ? 'red' : ''}">${sgn(dv.farq)} $</div><div class="mut">${dv.bad_n} ta farqli pozitsiya</div></div>
        <div><div class="lb">Vozvrat berilgan</div><div class="v grn">${fmt(dv.vozvrat_n)} ta</div><div class="mut">${usd(dv.vozvrat_summa, 2)}</div></div>
      </div>
      <div class="mut" style="margin-top:8px">Transh pulidan olingan: ${usd(dv.olingan)} · ${dv.filiallar} filial</div>
    </div>` : '') + `
    <div class="card">
      <div class="mut">Ta'minotchidagi qoldiq</div>
      <div class="big">${usd(d.left)}</div>
      <div class="mut">${a ? `Faol transh №${a.no} · birja ${a.birja} · ≈ ${fmt(d.gramm999)} gr 999` : 'Faol transh yo\'q'}</div>
      ${open.map(t => `<div class="bar"><i style="width:${Math.max(1, Math.min(100, t.pct))}%"></i></div>
        <div class="rw mut"><span>№${t.no} · ishlatilgan ${usd(t.used)}</span><span>${fmt(t.pct, 1)}%</span></div>`).join('')}
    </div>
    ${(d.yopiq_pullar || []).length && d.yetmadi && d.yetmadi.n ? `<div class="card alert">
      <b style="font-size:14px">⚠ Pul hisobga olinmayapti</b>
      <div class="mut" style="margin-top:4px">${fmt(d.yetmadi.n)} ta tovar (${usd(d.yetmadi.summa)}) uchun pul yetmadi — ular puldan ayirilmadi.
        Shu bilan birga quyidagi pulda hali pul bor, lekin u hisobdan chiqarilgan:</div>
      ${d.yopiq_pullar.map(t => `<div class="rw" style="margin-top:8px;gap:8px">
        <span><b>№${t.no} · ${dmy(t.sana)}</b> — qolgan ${usd(t.left)}<br><span class="mut">${t.sabab === 'yopilgan' ? 'Yopilgan ' + dmy(t.yopilgan) : t.sabab === 'ochirilgan' ? 'Tekshiruvdan o\'chirilgan' : 'Faqat eski prixod uchun'}</span></span>
        <button class="btn2" onclick="pulOch(${t.no}, '${t.sabab}')">Qayta ochish</button></div>`).join('')}
    </div>` : ''}
    ${o ? `<div class="card ${o.bad ? 'alert' : ''} inv" onclick="openFaktura('${esc(o.key)}', ${o.transh || 0})">
      <div class="rw"><b style="font-size:14px">${o.bad ? (o.farq > 0 ? '⚠ Oxirgi faktura qimmat' : '⚠ Oxirgi fakturada farq bor') : '✓ Oxirgi faktura to\'g\'ri'}</b>
        <b class="${o.farq > 0 && o.bad ? 'red' : ''}" style="white-space:nowrap">${o.bad ? sgn(o.farq) + ' $' : ''}</b></div>
      <div class="mut" style="margin-top:4px">${E(o.faktura)} · ${E(o.filial)} · ${dmy(o.sana)} · ${o.n} pozitsiya · ${usd(o.fakt, 2)}</div>
    </div>` : ''}
    <div class="g2">
      <div class="card"><div class="lb">Jami berilgan</div><div class="v">${usd(d.given)}</div></div>
      <div class="card"><div class="lb">Puldan olingan tovar</div><div class="v">${usd(d.used)}</div>
        <div class="mut">Jami tovar ${usd(d.jami_tovar)}${d.vozvrat_tovar ? ' · vozvrat ' + usd(d.vozvrat_tovar) : ''}</div></div>
      <div class="card"><div class="lb">Fakturalar</div><div class="v">${fmt(d.faktura_soni)}</div></div>
      <div class="card"><div class="lb">Jami farq</div><div class="v ${d.farq > 0 ? 'red' : ''}">${sgn(d.farq, 0)} $</div></div>
      <div class="card"><div class="lb">O'rtacha kunlik sarf</div><div class="v">${usd(d.temp)}</div></div>
      <div class="card"><div class="lb">Taxminiy tugash</div><div class="v">${dmy(d.tugash)}</div></div>
    </div>
    ${(d.vozvrat && d.vozvrat.n) || (d.qismlar || []).length ? `<div class="sec">Vozvrat</div>
    <div class="card">
      <div class="mut" style="margin-bottom:8px">1-qism · ro'yxat bo'yicha</div>
      <div class="g2">
        <div><div class="lb">Do'konlar qaytargan</div><div class="v">${fmt(d.vozvrat.n)} ta</div><div class="mut">${usd(d.vozvrat.summa)}</div></div>
        <div><div class="lb">Boshqa do'konga berilgan</div><div class="v grn">${fmt(d.vozvrat.berilgan_n)} ta</div><div class="mut">${usd(d.vozvrat.berilgan_summa)}</div></div>
      </div>
      <div class="rw" style="margin-top:10px"><span class="mut">Gavhar'da qolgan (hali berilmagan)</span><b>${d.vozvrat.yopilgan ? 'Yakunlangan ' + dm(d.vozvrat.yopilgan) : fmt(d.vozvrat.qolgan_n) + ' ta · ' + usd(d.vozvrat.qolgan_summa)}</b></div>

let UPRES = null, UPFILE = null;
function upCard() {
  if (!can('faktura_yuklash') && !can('vozvrat_yuklash')) return '';
  return `<div class="card" id="upcard">
    <div class="rw"><b>📤 Excel yuklash</b><span class="mut" style="font-size:12px">katta fayllar ham</span></div>
    <div class="mut" style="font-size:12px;margin-top:4px">Faktura, oylik / 15 kunlik prixod yoki vozvrat ro'yxati. Turini o'zi aniqlaydi.</div>
    <select id="uptur" style="width:100%;margin-top:8px;padding:8px">
      <option value="auto">Avto aniqlash</option>
      <option value="faktura">Kundalik faktura — reyestrga qo'shiladi, pul navbat bo'yicha</option>
      <option value="oylik">🔎 Faqat tekshirish — oylik, 15 kunlik yoki eski faktura (sana va narx bo'yicha o'zi topadi)</option>
      <option value="vozvrat">Vozvrat ro'yxati (+/−)</option>
    </select>
    <input type="file" id="upf" accept=".xlsx,.xlsm" multiple style="margin-top:8px;width:100%">
    <div class="mut" style="font-size:12px;margin-top:4px">Bir nechta faktura bo'lsa — hammasini birdan tanlang (100 ta ham bo'ladi), bitta javob keladi.</div>
    <button class="btn" id="upb" style="margin-top:8px">Yuklash</button>
    <div id="upst" class="mut" style="margin-top:6px"></div>
    ${UPRES ? `<div class="upres">${E(L(UPRES))}</div>` : ''}
  </div>`;
}
function bindUp() { const b = $('#upb'); if (b) b.onclick = () => doUp(); }
function doUp(mode) {
  const inp = $('#upf'), fs = (inp && inp.files.length) ? [...inp.files] : (UPFILE || []);
  if (!fs.length) return toast('Fayl tanlang');
  UPFILE = fs;
  const fd = new FormData();
  fd.append('tur', $('#uptur').value); if (mode) fd.append('mode', mode); fs.forEach(f => fd.append('file', f));
  const x = new XMLHttpRequest();
  x.open('POST', '/api/yuklash'); x.setRequestHeader('X-Init-Data', tg ? tg.initData : '');
  const st = $('#upst');
  x.upload.onprogress = e => { if (e.lengthComputable) st.textContent = `Yuklanmoqda… ${Math.round(e.loaded / e.total * 100)}%`; };
  x.onload = () => {
    let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
    if (x.status >= 300) { st.textContent = '⚠️ ' + L((j.errors || []).join('; ') || j.error || ('Xato ' + x.status)); return; }
    if (j.sorov) {
      st.innerHTML = `<div style="white-space:pre-wrap">${E(L(j.text))}</div><div style="margin-top:8px">
        <button class="btn2" onclick="doUp('full')">🔄 To'liq ro'yxat (+/−)</button> <button class="btn2" onclick="doUp('add')">➕ Faqat qo'shish</button></div>`;
      return;
    }
    UPRES = j.text; UPFILE = null; haptic('success');
    toast(j.tur === 'faktura' ? 'Faktura tekshirildi' : j.tur === 'oylik' ? 'Tekshirildi — Excel chatga yuborildi' : 'Vozvrat yangilandi');
    invalidate(); loadFaktura();
  };
  x.onerror = () => { st.textContent = '⚠️ Tarmoq xatosi'; };
  st.textContent = 'Yuklanmoqda…'; x.send(fd);
}

async function fakDel(key, fno, fil, n) {
  const msg = `${fno} · ${fil} (${n} ta tovar) fakturasini o'chiraymi? Pullar qayta hisoblanadi. Botga /bekor bilan qaytarish mumkin.`;
  const go = await new Promise(res => tg && tg.showConfirm && tg.initData ? tg.showConfirm(msg, res) : res(confirm(msg)));
  if (!go) return;
  try { await api('/api/faktura/ochir', {key}); haptic('success'); toast('Faktura o\'chirildi'); FOpen = null; dropSub('inv'); invalidate(); loadFaktura(); }
  catch (e) { toast(e.message); }
}
async function fakExcel(key, btn) {
  btn.disabled = true; const t = btn.textContent; btn.textContent = 'Yuborilmoqda…';
  try { await api('/api/faktura/excel', {key}); haptic('success'); toast('Excel chatga yuborildi'); }
  catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = t; }
}
async function loadFaktura() {
  const el = $('#p-faktura');

}
function openFaktura(key, no) {

        <div><div class="lb">Farq</div><div class="v ${g.farq > 0.5 ? 'red' : ''}">${sgn(g.farq)} $</div></div>

    <div id="flist"></div>`;
  CURG = g;

  $('#fq').oninput = e => { FQ = e.target.value; listFaktura(); };

/* ---------- DO'KON QIDIRUV ---------- */
let FQ = '', FV = 'inv', CURG = null;
const nk = s => L(s || '').toLowerCase().replace(/[ʻʼ’'`‘]/g, '').replace(/filiali?/g, '').replace(/ye/g, 'e').replace(/[^a-z0-9]+/g, ' ').trim();
function listFaktura() {
  const box = $('#flist'); if (!box || !CURG) return;
  const q = nk(FQ);
  const all = CURG.items.concat(FD.other || []);
  const items = all.filter(a => !q || nk(a.filial + ' ' + a.faktura).includes(q) || (a.faktura || '').toLowerCase().includes(FQ.trim().toLowerCase()));
  if (FV === 'dok') {
    const m = {};
    items.forEach(a => { const k = a.filial || '—'; const x = m[k] = m[k] || {f: k, n: 0, fakt: 0, farq: 0, bad: 0, oxirgi: ''};
      x.n++; x.fakt += a.fakt || 0; x.farq += a.farq || 0; x.bad += a.bad ? 1 : 0; if ((a.sana || '') > x.oxirgi) x.oxirgi = a.sana; });
    const ds = Object.values(m).sort((a, b) => b.farq - a.farq);
    box.innerHTML = `<div class="mut" style="margin:0 4px 8px">${ds.length} ta do'kon${q ? ' topildi' : ''} · farq bo'yicha saralangan</div>` +
      (ds.length ? ds.map(x => `<div class="card dok" data-f="${esc(x.f)}" style="cursor:pointer">
        <div class="rw"><b style="font-size:15px">${E(x.f)}</b>${farqBadge(x.farq, x.bad)}</div>
        <div class="mut">${x.n} ta faktura · ${usd(x.fakt, 2)} · oxirgi ${dmy(x.oxirgi)}${x.bad ? ` · <span style="color:var(--red)">${x.bad} tasida xato</span>` : ''}</div>
      </div>`).join('') : '<div class="card empty">Do\'kon topilmadi</div>');
    box.querySelectorAll('.dok').forEach(c => c.onclick = () => { FQ = c.dataset.f; FV = 'inv'; renderFaktura(); window.scrollTo(0, $('#fq').getBoundingClientRect().top + scrollY - 80); });
    return;
  }
  box.innerHTML = `${q ? `<div class="mut" style="margin:0 4px 8px">${items.length} ta faktura topildi</div>` : ''}` +
    (items.length ? items.slice(0, 200).map(a => invCard(a)).join('') + (items.length > 200 ? `<div class="card empty">… yana ${items.length - 200} ta — qidiruvni aniqlashtiring</div>` : '')
      : `<div class="card empty">${q ? 'Hech narsa topilmadi' : 'Bu transh bo\'yicha faktura yo\'q'}</div>`);

    else { FOpen = c.dataset.k; pushSub('inv', () => { FOpen = null; renderFaktura(); }, 'Fakturalar ro\'yxati'); }
    renderFaktura();
  });
}

/* ---------- XATOLIKLARNI EXCEL'GA ---------- */
async function xatoExcel(extra, btn) {
  const fs = XF.filial ? [...new Set(XR.filter(r => nk(r.filial).includes(nk(XF.filial))).map(r => r.filial))] : [];
  const body = Object.assign({tr: F.tr, oy: F.oy, k: XF.k, filial: '', filiallar: fs, tur: XF.tur, q: XF.q}, extra || {});
  if (extra && extra.faktura) Object.assign(body, {k: 'all', filial: '', tur: '', q: ''});
  const t = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Yuborilmoqda…'; }
  try { const r = await api('/api/xatolar/excel', body); haptic('success'); toast(`Excel chatga yuborildi: ${r.n} ta xato, ${sgn(r.farq)} $`); }
  catch (e) { toast(e.message); }
  if (btn) { btn.disabled = false; btn.textContent = t; }
}

async function trDel(no, sana, summa) {

function qcNum(id) { const e = $(id); if (!e) return null; const v = parseFloat(String(e.value).replace(/\s/g, '').replace(',', '.')); return isNaN(v) ? null : v; }
function qcFill() {

function qcCalc() {
  const out = $('#qcout'); if (!out) return;
  const birja = qcNum('#qc_birja'), kurs = qcNum('#qc_kurs'), mb = qcNum('#qc_mb'), metIn = qcNum('#qc_met');

  if (!birja) { out.innerHTML = '<div class="mut">Birja narxini kiriting.</div>'; return; }
  const kG = st / (1 + st) * (1 - gav / 100), kL = st / (1 + st) * (1 - qon / 100);
  const lom = Math.round(birja * 585 / 999 * 100) / 100;
  const pr = {}; document.querySelectorAll('.qc_p').forEach(i => { const v = parseFloat(String(i.value).replace(',', '.')); if (!isNaN(v)) pr[i.dataset.t] = v; });

  const rev = QC_T.filter(t => pr[t] != null && pr[t] - lom - QC_ISH[t] > 0.02 && kG > 0)
    .map(t => ({t, P: pr[t], Q: pr[t] - lom - QC_ISH[t], C: pr[t] - (pr[t] - lom - QC_ISH[t]) / kG}));
  const uniq = rev.filter((r, i) => rev.findIndex(x => Math.abs(x.P - r.P) < 1e-9) === i);
  const Cg = uniq.length ? uniq.reduce((a, r) => a + r.C, 0) / uniq.length : null;
  let C = null, src = '';
  if (metIn) { C = metIn; src = 'siz kiritgan'; }

  else if (Cg) { C = Cg; src = 'Gavhar narxidan (teskari hisob)'; }
  let h = `<div style="background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px">
    <div><b>1) Lom</b> = ${fmt(birja, 2)} × 585 / 999 = <b>${fmt(lom, 2)}</b> $/gr</div>`;
  if (uniq.length) h += `<div style="margin-top:6px"><b>2) Gavhar ishlatgan metall qiymati</b> (teskari hisob, Gavhar ${fmt(gav)}% qaytadi deb):<br>
      <span class="mut">metall = narx − Gavhar QQS ÷ (12/112 × ${fmt((100 - gav) / 100, 2)}) = narx − QQS ÷ ${fmt(kG, 4)}</span>
      ${uniq.map(r => `<div>${TRN(r.t)}: ${fmt(r.P, 2)} − ${fmt(r.Q, 2)} ÷ ${fmt(kG, 4)} = <b>${fmt(r.C, 2)}</b></div>`).join('')}
      <div>O'rtacha: <b>${fmt(Cg, 2)}</b> $/gr (999 da ${fmt(Cg * 999 / 585, 2)})${kurs ? ` → MB narxi bo'lishi kerak: ${fmt(Cg * 999 / 585 * kurs, 0)} so'm/gr` : ''}. Farqlar — QQS 0.01 gacha yaxlitlangani uchun.</div></div>`;
  else h += `<div style="margin-top:6px" class="mut">Gavhar narxida QQS yo'q yoki narxlar kiritilmagan.</div>`;
  if (C) {
    h += `<div style="margin-top:6px"><b>3) Tekshiruv uchun metall</b> = <b>${fmt(C, 2)}</b> $/gr <span class="mut">(${src})</span>`;
    if (Cg && (mb && kurs || metIn)) { const d = C - Cg; h += `<br>${Math.abs(d) < 0.15 ? '✅ Gavhar ishlatgan metall shu bilan mos' : d > 0 ? `⚠ Gavhar metallni ${fmt(d, 2)} $/gr <b>past</b> olgan → QQS bazasi katta → QQS ko'p` : `ℹ Gavhar metallni ${fmt(-d, 2)} $/gr yuqori olgan → QQS kam (bizga foyda)`}`; }
    h += `</div><table style="margin-top:8px;font-size:12px"><tr><th>Tur</th><th>Narx</th><th>Baza</th><th>To'liq</th><th>Gavhar</th><th>Qonun</th><th>Ort.</th><th></th></tr>`;
    let shown = {};
    QC_T.forEach(t => {
      if (pr[t] == null) return;
      const base = lom + QC_ISH[t], Pg = pr[t], Qg = Pg - base;
      let Pl = kL < 1 ? (base - kL * C) / (1 - kL) : base; if (Pl < C) Pl = base;
      const full = Math.max(Pg - C, 0) * st / (1 + st), Ql = Pl - base, o = Pg - Pl;
      h += `<tr><td>${TRN(t).replace(" / ko'zsiz", '')}</td><td>${fmt(Pg, 2)}</td><td>${fmt(Pg - C, 2)}</td><td>${fmt(full, 2)}</td><td>${fmt(Qg, 2)}</td><td>${fmt(Ql, 2)}</td>
        <td class="${o > 0.015 ? 'red' : ''}"><b>${o > 0 ? '+' : ''}${fmt(o, 2)}</b></td><td>${Math.abs(o) <= 0.015 ? '✅' : o > 0 ? '❌' : 'ℹ'}</td></tr>`;
    });
    h += `</table><div class="mut" style="font-size:11px;margin-top:4px">Baza = narx − metall · To'liq = baza × 12/112 · Gavhar = narx − (lom + ishchilik) · Qonun — ${fmt(qon)}% qaytsa narxga qo'shiladigan QQS · Ort. — ortiqcha $/gr</div>`;
    const no = +$('#qc_tr').value;
    if (no && (metIn || (mb && kurs))) h += `<button class="btn2" style="margin-top:8px" onclick="qcSave(${no}, ${C.toFixed(4)})">💾 Shu metall qiymatini №${no} pulga saqlash</button>`;
  } else h += `<div class="mut" style="margin-top:6px">MB oltin narxi va kursni (yoki metall qiymatini) kiriting.</div>`;
  out.innerHTML = h + '</div>';
}
async function qcSave(no, C) {
  try { await api('/api/qqs/metall', {no, metall_585: C}); haptic('success'); toast(`№${no} ga saqlandi`); loadAdmin(ADM); }
  catch (e) { toast(e.message); }
}
async function qqsMet(no) {
  try { await api('/api/qqs/metall', {no, metall_585: $('#qmet' + no).value}); haptic('success'); toast('Saqlandi'); loadAdmin(ADM); }
  catch (e) { toast(e.message); }
}
async function qqsSave() {
  const body = {stavka: $('#qq_st').value, qonun_qaytish: $('#qq_qon').value, gavhar_qaytish: $('#qq_gav').value};
  try { await api('/api/qqs', body); haptic('success'); toast('QQS sozlamasi saqlandi'); QQSF = null; loadAdmin(ADM); }
  catch (e) { toast(e.message); }
}
async function sozSeriya() {
  try { await api('/api/seriya', {seriya: $('#seriya').value}); haptic('success'); toast('Saqlandi — fakturalar qayta hisoblandi'); invalidate(); loadAdmin(ADM); }
  catch (e) { toast(e.message); }
}
async function sozVqSave() {
  const body = {summa: $('#vqs').value, birja: $('#vqb').value, narxlar: Object.fromEntries([...document.querySelectorAll('.vqp')].map(i => [i.dataset.t, i.value]))};
  try { const r = await api('/api/vozvrat/qism', body); haptic('success'); toast(`Vozvrat ${r.no}-qism saqlandi`); VQFORM = false; invalidate(); loadAdmin(ADM); }
  catch (e) { toast(e.message); }
}
const PRESET_L = {tekshiruvchi: '🔍 Tekshiruvchi', koruvchi: '👁 Ko\'ruvchi', boshqaruvchi: '💳 Boshqaruvchi'};
const PERM_L = {holat: '📊 Holat (qoldiq, umumiy)', faktura: '🧾 Faktura bo\'limi', xatolar: '⚠️ Xatoliklar',
  transhlar: '💳 Transhlar va narxlar (ko\'rish)', faktura_yuklash: '📥 Faktura yuklash (botga)', vozvrat_yuklash: '↩️ Vozvrat ro\'yxatini yuklash',
  transh_qoshish: '➕ Transh qo\'shish / yopish, chegara', hisobot: '📑 Excel hisobot olish'};
function permOpen(id) {
  PERM_OPEN = PERM_OPEN === id ? null : id;
  if (PERM_OPEN) pushSub('perm', () => { PERM_OPEN = null; loadAdmin(ADM); }, 'Foydalanuvchilar'); else dropSub('perm');
  loadAdmin(ADM);
}
async function permSet(id, el) {
  const box = el.closest('div');
  const perms = [...box.querySelectorAll('input[data-pk]')].filter(x => x.checked).map(x => x.dataset.pk);
  try { ADM = await api('/api/admin', {act: 'perms', id, perms}); haptic('success'); toast('Saqlandi'); } catch (e) { toast(e.message); }
}
async function adm(act, id, role) {
  try { const d = await api('/api/admin', {act, id, role}); haptic('success');
    if ((act === 'approve' || act === 'add') && role !== 'admin' && !PRESET_L[role]) { PERM_OPEN = +id; pushSub('perm', () => { PERM_OPEN = null; loadAdmin(ADM); }, 'Foydalanuvchilar'); }
    if (act === 'delete' && PERM_OPEN === +id) { PERM_OPEN = null; dropSub('perm'); }
    toast(act === 'approve' ? 'Ruxsat berildi — endi nimalarni ko\'rishini belgilang' : act === 'reject' ? 'Rad etildi' : act === 'role' ? 'Rol o\'zgardi' : 'Bajarildi'); loadAdmin(d); }
  catch (e) { toast(e.message); }
}
async function admDel(id, name) {
  const msg = `${name || id} ni o'chirasizmi? U botga kira olmay qoladi.`;
  const go = await new Promise(res => tg && tg.showConfirm && tg.initData ? tg.showConfirm(msg, res) : res(confirm(msg)));
  if (go) adm('delete', id);
}
async function admAdd() {
  const id = $('#adm-id').value.trim();
  if (!/^\d{5,15}$/.test(id)) { toast('ID raqamini to\'g\'ri kiriting'); return; }
  await adm('add', id, $('#adm-role').value);
}
async function admInv(role) {
  try { const d = await api('/api/admin', {act: 'invite', role});
    await loadAdmin(d);
    $('#inv-out').innerHTML = `<div class="card" style="background:var(--bg);margin:10px 0 0;padding:10px">
      <div class="mut">${PRESET_L[role] || '👑 Admin'} uchun havola (muddatsiz):</div>
      <div style="word-break:break-all;font-size:13px;margin:6px 0">${esc(d.link)}</div>
      <button class="btn2" onclick="navigator.clipboard && navigator.clipboard.writeText('${esc(d.link)}').then(() => toast('Nusxalandi'))">📋 Nusxalash</button></div>`;
    haptic('success');
  } catch (e) { toast(e.message); }
}

const TAB_PERM = {holat: 'holat', faktura: 'faktura', xato: 'xatolar', transh: 'transhlar'};
const can = p => !ME || !ME.perms || ME.perms.includes(p);
initMe().then(() => {
  document.querySelectorAll('.tab').forEach(t => { const p = TAB_PERM[t.dataset.p]; if (p && !can(p)) t.style.display = 'none'; });
  if (location.hash === '#admin' && ME && ME.admin) return show('admin');
  if (location.hash === '#yuklash' && can('faktura')) { show('faktura'); return setTimeout(() => { const c = $('#upcard'); if (c) c.scrollIntoView(); }, 600); }
  const first = Object.keys(TAB_PERM).find(k => can(TAB_PERM[k]));
  if (first) show(first);
  else $('#p-holat').innerHTML = '<div class="card empty">Sizga hali hech qanday bo\'lim ochilmagan. Adminga murojaat qiling.</div>';
});
</script>
</body>
</html>
